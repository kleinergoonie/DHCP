name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ── Lint ────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check src/ tests/ raft_server.py --select E,W,F --ignore E501

  # ── Unit tests ─────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pysyncobj
          pip install pytest pytest-timeout

      - name: Run unit tests (state machine)
        run: |
          pytest tests/test_state_machine.py -v --timeout=60

      - name: Run unit tests (lease manager)
        run: |
          pytest tests/test_raft_lease_manager.py -v --timeout=60

  # ── Integration tests ───────────────────────────────────────────────
  integration-tests:
    name: Integration Tests (3-node Raft cluster)
    runs-on: ubuntu-latest
    # Integration tests take longer; run them in a separate job so unit
    # tests are not blocked by the slow election timers.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pysyncobj
          pip install pytest pytest-timeout

      - name: Run integration tests
        run: |
          pytest tests/test_integration.py -v --timeout=120
        # Integration tests start real Raft clusters in-process; give them
        # plenty of time for leader election (typically <5s per cluster).
